eval_type: f1
sam_checkpoint: /home/ubuntu/fuxiwen/opensdi/SAM3Adapter/ckpt/sam3.pt
data_norm:
  inp:
    sub:
    - 0.5
    div:
    - 0.5
  gt:
    sub:
    - 0.5
    div:
    - 0.5
  gt_rgb:
    sub:
    - 0.5
    div:
    - 0.5
model:
  name: sam
  args:
#    inp_size: 1024
    inp_size: 1008
    loss: iou
    encoder_mode:
      name: sam
#      img_size: 1024
      img_size: 1008
      mlp_ratio: 4
      patch_size: 16
      qkv_bias: true
      use_rel_pos: true
      window_size: 14
      out_chans: 256
      scale_factor: 32
      input_type: fft
      freq_nums: 0.25
      prompt_type: highpass
      prompt_embed_dim: 256
      tuning_stage: 1234
    #这个handcrafted_tune无法控制，在vitDet中修改
      handcrafted_tune: false
      embedding_tune: true
      adaptor: adaptor
      embed_dim: 1024
      depth: 24
      num_heads: 16
      global_attn_indexes:
      - 5
      - 11
      - 17
      - 23
optimizer:
  name: adamw
  args:
    lr: 0.0002
lr_min: 1.0e-7
epoch_max: 20

multi_step_lr:
  milestones:
  - 1
  gamma: 0.1
epoch_val: 3
epoch_save: 1

resume: 0
#start_epoch: 60
